<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>AdbloquRs test page</title>
  </head>
  <body>
    <h1>AdbloquRs verification page</h1>
    <p>
      This page intentionally requests resources from domains the bundled
      lists block. They will fail to load; the point is that the service
      worker logs each one.
    </p>
    <img src="https://ad.doubleclick.net/banner.gif" alt="ad" width="1" height="1" />
    <img src="https://pagead2.googlesyndication.com/banner.gif" alt="ad" width="1" height="1" />
    <img src="https://www.google-analytics.com/collect" alt="tracker" width="1" height="1" />
    <img src="https://api.mixpanel.com/beacon" alt="tracker" width="1" height="1" />
    <script>
      // sendBeacon-style tracking call surfaces as a "ping" request.
      if (navigator.sendBeacon) {
        navigator.sendBeacon("https://www.google-analytics.com/beacon")
      }
    </script>
  </body>
</html>
